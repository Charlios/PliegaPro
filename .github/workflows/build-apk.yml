
name: Comprobar firma y compilar PliegaPro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PliegaPro.html'
      - 'PliegaPro_logo.png'
      - 'PliegaPro.apk'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar archivos necesarios
        shell: bash
        run: |
          set -e
          echo "Archivos del repositorio:"
          ls -la

          test -f "PliegaPro.html"
          test -f "PliegaPro_logo.png"
          test -f "PliegaPro.apk"

          echo "Los tres archivos existen."

      - name: Preparar herramientas Android
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Buscando sdkmanager..."

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            for candidate in \
              "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
              "$ANDROID_HOME/tools/bin/sdkmanager"; do
              if [ -x "$candidate" ]; then
                SDKMANAGER="$candidate"
                break
              fi
            done
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encuentra sdkmanager."
            exit 1
          fi

          echo "Usando: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "build-tools;35.0.0"

          echo "Herramientas Android preparadas."

      - name: Comprobar firma de la APK original
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "===== APK ORIGINAL ====="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            PliegaPro.apk

      - name: Preparar herramienta para iconos
        shell: bash
        run: |
          set -e
          python3 -m venv /tmp/icon-venv
          /tmp/icon-venv/bin/pip install Pillow

      - name: Crear iconos Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          /tmp/icon-venv/bin/python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          source = Path("PliegaPro_logo.png")

          with Image.open(source) as original:
              image = original.convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              output_dir = Path("app/src/main/res") / folder
              output_dir.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  image,
                  (size, size),
                  method=Image.Resampling.LANCZOS
              )

              icon.save(
                  output_dir / "ic_launcher.png",
                  format="PNG"
              )

              print(f"Icono creado: {folder}")

          print("Iconos generados correctamente.")
          PY

      - name: Crear estructura Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/pliegapro/app

          cp "PliegaPro.html" app/src/main/assets/index.html

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'PliegaPro'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pliegapro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.pliegapro.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 2
                  versionName '1.1'
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="PliegaPro"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          XML

          cat > app/src/main/java/com/pliegapro/app/MainActivity.java <<'JAVA'
          package com.pliegapro.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_CHOOSER_REQUEST = 101;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          try {
                              startActivityForResult(
                                  params.createIntent(),
                                  FILE_CHOOSER_REQUEST
                              );
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }

                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST
                          && fileCallback != null) {

                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK && data != null) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[]{uri};
                          }
                      }

                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

      - name: Instalar Gradle
        shell: bash
        run: |
          set -e

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK de prueba
        shell: bash
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Comprobar firma de la APK nueva
        shell: bash
        run: |
          set -e

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "===== APK NUEVA ====="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: PliegaPro-APK-Prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
