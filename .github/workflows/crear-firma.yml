
name: Crear firma permanente PliegaPro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crear-firma:
    runs-on: ubuntu-latest
    steps:
      - name: Generar y guardar firma segura
        env:
          GH_TOKEN: ${{ secrets.SETUP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          KEYSTORE="$RUNNER_TEMP/pliegapro-release.jks"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"
          ALIAS="pliegapro"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PliegaPro, O=PliegaPro, C=ES"

          export KEYSTORE STORE_PASS KEY_PASS ALIAS
          python3 -m pip install --quiet pynacl

          python3 <<'PY'
          import os, json, base64, urllib.request
          from nacl.public import PublicKey, SealedBox

          repo = "Charlios/PliegaPro"
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json"
          }

          def request(url, method="GET", data=None):
              req = urllib.request.Request(
                  url, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req) as response:
                  body = response.read()
                  return json.loads(body) if body else {}

          base = "https://api.github.com/repos/" + repo
          public = request(base + "/actions/secrets/public-key")
          pubkey = PublicKey(base64.b64decode(public["key"]))
          box = SealedBox(pubkey)

          with open(os.environ["KEYSTORE"], "rb") as f:
              keystore = base64.b64encode(f.read()).decode()

          values = {
              "SIGNING_KEYSTORE_BASE64": keystore,
              "SIGNING_STORE_PASSWORD": os.environ["STORE_PASS"],
              "SIGNING_KEY_PASSWORD": os.environ["KEY_PASS"],
              "SIGNING_KEY_ALIAS": os.environ["ALIAS"]
          }

          for name, value in values.items():
              encrypted = base64.b64encode(
                  box.encrypt(value.encode())
              ).decode()
              data = json.dumps({
                  "encrypted_value": encrypted,
                  "key_id": public["key_id"]
              }).encode()
              request(
                  base + "/actions/secrets/" + name,
                  method="PUT",
                  data=data
              )
              print("Secreto guardado: " + name)

          request(
              base + "/actions/secrets/SETUP_TOKEN",
              method="DELETE"
          )
          print("Acceso temporal eliminado de los secretos.")
          print("Firma permanente creada y guardada.")
          PY

          rm -f "$KEYSTORE"
